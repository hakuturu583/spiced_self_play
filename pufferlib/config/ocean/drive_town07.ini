[base]
package = ocean
env_name = puffer_drive_town07
policy_name = Drive
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_workers = 8
num_envs = 8
batch_size = 8
sync_traj = False

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 2048
action_type = discrete
dynamics_model = delta_local
fix_rewards = True
fix_lambdas = True
lambda_value = 0.0
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
reward_goal = 1.0
obs_partner_noise_speed = 0.0
obs_partner_noise_pos = 0.0
dt = 0.1
async_resets = True
goal_radius = 2.5
goal_speed = 100.0
goal_behavior = 1
goal_target_distance = 30.0
collision_behavior = 0
offroad_behavior = 0
episode_length = 110
resample_frequency = 0
termination_mode = 1
map_dir = "resources/drive/binaries/town07_selfplay"
num_maps = 1
init_steps = 0
control_mode = "control_agents"
sdc_controller = "policy"
non_sdc_controller = "policy"
non_vehicle_controller = "policy"
init_mode = "create_all_valid"
max_controlled_agents = 32
render_mode = 1
reg_mode = "None"
anchor_cpt_path = None

[train]
seed = 42
total_timesteps = 20_000_000_000
anneal_lr = True
anneal_entropy = False
batch_size = 524288
minibatch_size = 65536
max_minibatch_size = 65536
rollout_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.0001
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.001
max_grad_norm = 1
prio_alpha = 0.85
prio_beta0 = 0.85
update_epochs = 1
vf_clip_coef = 0.2
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 500
optimizer = adam

[eval]
eval_interval = 5000
map_dir = "resources/drive/binaries/town07_selfplay"
num_eval_agents = 32
self_play_eval = False
human_replay_eval = False
render_select_mode = "random"
render_human_replay_eval = False
render_self_play_eval = False
wosac_realism_eval = False
backend = PufferEnv
